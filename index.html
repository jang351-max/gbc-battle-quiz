<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GBC 배틀 퀴즈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Galmuri9', monospace;
      image-rendering: pixelated;
    }

    body {
      background-color: #202020;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* GBC 160x144 비율 스케일링 컨테이너 */
    #gbc-screen {
      width: 480px;
      height: 432px;
      background-color: #F8F8F8;
      border: 8px solid #383838;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 1. 상단 배틀 필드 */
    #battle-field {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #D0E8C8 0%, #F8F8F8 75%);
      border-bottom: 4px solid #181818;
    }

    /* GBC 공통 박스 스타일 */
    .status-box {
      position: absolute;
      background: #F8F8F8;
      border: 3px solid #181818;
      border-radius: 6px;
      padding: 6px 10px;
      width: 190px;
      box-shadow: 2px 2px 0px #888;
    }

    .status-box .name-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      color: #181818;
      margin-bottom: 4px;
    }

    .hp-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #383838;
      padding: 3px 5px;
      border-radius: 3px;
    }

    .hp-tag {
      color: #E89020;
      font-size: 10px;
      font-weight: bold;
    }

    .hp-bar-bg {
      flex: 1;
      height: 6px;
      background: #707070;
      border-radius: 2px;
      overflow: hidden;
    }

    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: #20C840;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* 적/아군 상태창 위치 */
    #enemy-status { top: 18px; left: 16px; }
    #player-status { bottom: 20px; right: 16px; }

    /* 적/아군 발판 및 스프라이트 */
    .pedestal {
      position: absolute;
      background: #B8D8A0;
      border: 3px solid #608850;
      border-radius: 50%;
    }

    #enemy-pedestal {
      width: 140px;
      height: 40px;
      top: 100px;
      right: 30px;
    }

    #player-pedestal {
      width: 160px;
      height: 46px;
      bottom: 12px;
      left: 20px;
    }

    .sprite {
      position: absolute;
      width: 96px;
      height: 96px;
      transition: transform 0.1s;
    }

    #enemy-sprite { top: 32px; right: 50px; }
    #player-sprite { bottom: 24px; left: 52px; }

    /* 피격 애니메이션 */
    .hit-anim {
      animation: hitShake 0.3s ease-in-out;
    }

    @keyframes hitShake {
      0% { opacity: 1; transform: translateX(0); }
      25% { opacity: 0.2; transform: translateX(-8px); }
      50% { opacity: 1; transform: translateX(8px); }
      75% { opacity: 0.2; transform: translateX(-4px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* 2. 하단 GBC 2중 테두리 대화창/커맨드 */
    #panel-area {
      height: 148px;
      background: #F8F8F8;
      padding: 6px;
      display: flex;
      flex-direction: column;
    }

    .gbc-box {
      width: 100%;
      height: 100%;
      background: #F8F8F8;
      border: 4px solid #181818;
      outline: 2px solid #A8A8A8;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #dialog-text {
      font-size: 15px;
      line-height: 1.4;
      color: #181818;
      min-height: 42px;
    }

    /* 4지선다 커맨드 버튼 */
    #command-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    .cmd-btn {
      background: #E8E8E8;
      border: 2px solid #181818;
      border-radius: 4px;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: bold;
      color: #181818;
      cursor: pointer;
      text-align: left;
      padding-left: 10px;
    }

    .cmd-btn:hover:not(:disabled) {
      background: #C8E8F8;
      border-color: #0058A8;
    }

    .cmd-btn:disabled {
      cursor: default;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div id="gbc-screen">
  <!-- 배틀 필드 -->
  <div id="battle-field">
    <!-- 적 상태 -->
    <div id="enemy-status" class="status-box">
      <div class="name-row">
        <span>오답마왕</span>
        <span>:L50</span>
      </div>
      <div class="hp-row">
        <span class="hp-tag">HP</span>
        <div class="hp-bar-bg"><div id="enemy-hp" class="hp-bar-fill"></div></div>
      </div>
    </div>
    <div id="enemy-pedestal" class="pedestal"></div>
    <svg id="enemy-sprite" class="sprite" viewBox="0 0 56 56">
      <!-- 56x56 GBC 스타일 적 몬스터 SVG -->
      <rect x="16" y="8" width="24" height="24" fill="#784890" />
      <rect x="12" y="14" width="32" height="20" fill="#784890" />
      <rect x="20" y="16" width="6" height="6" fill="#F8F8F8" />
      <rect x="30" y="16" width="6" height="6" fill="#F8F8F8" />
      <rect x="22" y="18" width="2" height="2" fill="#181818" />
      <rect x="32" y="18" width="2" height="2" fill="#181818" />
      <rect x="22" y="26" width="12" height="3" fill="#D03030" />
    </svg>

    <!-- 아군 상태 -->
    <div id="player-status" class="status-box">
      <div class="name-row">
        <span>탐험가</span>
        <span>:L50</span>
      </div>
      <div class="hp-row">
        <span class="hp-tag">HP</span>
        <div class="hp-bar-bg"><div id="player-hp" class="hp-bar-fill"></div></div>
      </div>
    </div>
    <div id="player-pedestal" class="pedestal"></div>
    <svg id="player-sprite" class="sprite" viewBox="0 0 56 56">
      <!-- 56x56 GBC 스타일 뒷모습 실루엣 SVG -->
      <rect x="16" y="6" width="24" height="20" fill="#205088" />
      <rect x="12" y="24" width="32" height="24" fill="#388850" />
      <rect x="18" y="10" width="20" height="6" fill="#C83838" />
    </svg>
  </div>

  <!-- 대화창 및 커맨드 -->
  <div id="panel-area">
    <div class="gbc-box">
      <div id="dialog-text">문제가 나타났다! 올바른 답을 고르자!</div>
      <div id="command-grid">
        <button class="cmd-btn" onclick="selectAnswer(0)"></button>
        <button class="cmd-btn" onclick="selectAnswer(1)"></button>
        <button class="cmd-btn" onclick="selectAnswer(2)"></button>
        <button class="cmd-btn" onclick="selectAnswer(3)"></button>
      </div>
    </div>
  </div>
</div>

<script>
  // 1. 8비트 Web Audio 사운드 신시사이저
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'hit') { // 피격 저음 펄스
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'correct') { // 정답 고음 팡파르
      osc.type = 'square';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
      osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  }

  // 2. 퀴즈 데이터
  const quizData = [
    {
      q: "산성 용액에 푸른색 리트머스 종이를 넣으면?",
      options: ["붉은색으로 변한다", "노란색으로 변한다", "변화가 없다", "푸른색이 진해진다"],
      ans: 0
    },
    {
      q: "조선 시대 독도를 지켜낸 대표적인 인물은?",
      options: ["김정호", "안용복", "장영실", "이황"],
      ans: 1
    },
    {
      q: "식물의 광합성에 반드시 필요한 기체는?",
      options: ["산소", "질소", "이산화 탄소", "수소"],
      ans: 2
    },
    {
      q: "정조가 축조한 계획도시이자 세계문화유산은?",
      options: ["남한산성", "수원 화성", "북한산성", "행주산성"],
      ans: 1
    }
  ];

  let currentIdx = 0;
  let enemyHp = 100;
  let playerHp = 100;

  function updateHpBars() {
    const eBar = document.getElementById('enemy-hp');
    const pBar = document.getElementById('player-hp');
    eBar.style.width = Math.max(0, enemyHp) + '%';
    pBar.style.width = Math.max(0, playerHp) + '%';

    // 체력 색상 전이
    eBar.style.backgroundColor = enemyHp > 50 ? '#20C840' : (enemyHp > 20 ? '#F8B800' : '#D03030');
    pBar.style.backgroundColor = playerHp > 50 ? '#20C840' : (playerHp > 20 ? '#F8B800' : '#D03030');
  }

  function loadQuestion() {
    if (currentIdx >= quizData.length || enemyHp <= 0 || playerHp <= 0) return;
    const cur = quizData[currentIdx];
    document.getElementById('dialog-text').innerText = `Q${currentIdx + 1}. ${cur.q}`;
    const btns = document.querySelectorAll('.cmd-btn');
    btns.forEach((btn, idx) => {
      btn.innerText = `▶ ${cur.options[idx]}`;
      btn.disabled = false;
    });
  }

  function selectAnswer(userPick) {
    const btns = document.querySelectorAll('.cmd-btn');
    btns.forEach(b => b.disabled = true);

    const cur = quizData[currentIdx];
    const isCorrect = (userPick === cur.ans);

    if (isCorrect) {
      playSound('correct');
      enemyHp -= 34;
      document.getElementById('enemy-sprite').classList.add('hit-anim');
      document.getElementById('dialog-text').innerText = "효과가 굉장했다! 오답마왕에게 큰 피해!";
      setTimeout(() => document.getElementById('enemy-sprite').classList.remove('hit-anim'), 350);
    } else {
      playSound('hit');
      playerHp -= 34;
      document.getElementById('player-sprite').classList.add('hit-anim');
      document.getElementById('dialog-text').innerText = "아쉽다! 오답마왕의 반격을 받았다!";
      setTimeout(() => document.getElementById('player-sprite').classList.remove('hit-anim'), 350);
    }

    updateHpBars();

    setTimeout(() => {
      if (enemyHp <= 0) {
        document.getElementById('dialog-text').innerText = "★ 승리! 오답마왕을 물리쳤습니다!";
      } else if (playerHp <= 0) {
        document.getElementById('dialog-text').innerText = "눈앞이 캄캄해졌다... 패배했습니다.";
      } else {
        currentIdx++;
        if (currentIdx < quizData.length) {
          loadQuestion();
        } else {
          document.getElementById('dialog-text').innerText = "배틀 종료! 수고하셨습니다.";
        }
      }
    }, 1200);
  }

  loadQuestion();
</script>
</body>
</html>
